<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TENDIDO 039 · Reporte Ejecutivo</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f0f4f8;--white:#fff;--surf:#f8fafc;
  --navy:#0f2744;--blue:#1d4ed8;--blue2:#3b82f6;--blue3:#dbeafe;--blue4:#eff6ff;
  --green:#059669;--green2:#d1fae5;--green3:#ecfdf5;
  --gold:#b45309;--gold2:#fef3c7;--gold3:#fffbeb;
  --red:#dc2626;--red2:#fee2e2;--red3:#fef2f2;
  --purple:#7c3aed;--purple2:#ede9fe;
  --gray:#64748b;--gray2:#e2e8f0;--gray3:#f1f5f9;--gray4:#cbd5e1;
  --txt:#0f172a;--txt2:#334155;--txt3:#64748b;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.05);
  --shadow2:0 4px 12px rgba(0,0,0,.08);
  --shadow3:0 10px 25px rgba(0,0,0,.1);
  --rad:12px;--rad2:8px;
}
html,body{background:var(--bg);color:var(--txt);font-family:'Inter',sans-serif;font-size:14px;min-height:100vh}

/* ── HEADER ── */
.header{background:linear-gradient(135deg,var(--navy) 0%,#1e3a5f 100%);color:#fff;padding:0;position:sticky;top:0;z-index:200;box-shadow:0 2px 20px rgba(0,0,0,.25)}
.header-inner{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;max-width:1400px;margin:0 auto}
.header-brand{display:flex;flex-direction:column;gap:2px}
.header-title{font-size:20px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.header-title .dot{width:10px;height:10px;border-radius:50%;background:#10b981;animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.header-sub{font-size:11px;color:rgba(255,255,255,.55);letter-spacing:.06em;text-transform:uppercase}
.header-right{display:flex;align-items:center;gap:10px}
.sync-chip{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);padding:6px 14px;border-radius:99px;font-size:12px;font-weight:500;cursor:pointer;transition:all .2s}
.sync-chip:hover{background:rgba(255,255,255,.15)}
.sync-chip.err{border-color:rgba(239,68,68,.5);background:rgba(239,68,68,.1)}
.mode-toggle{display:flex;background:rgba(255,255,255,.08);border-radius:99px;padding:3px}
.mode-btn{padding:5px 14px;border-radius:99px;font-size:11px;font-weight:700;cursor:pointer;border:none;background:transparent;color:rgba(255,255,255,.6);letter-spacing:.04em;transition:all .2s}
.mode-btn.active{background:#fff;color:var(--navy)}

/* ── FILTERS ── */
.filters{background:var(--white);border-bottom:1px solid var(--gray2);padding:10px 24px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;max-width:100%}
.f-label{font-size:10px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.08em}
.f-sel{padding:6px 12px;border:1px solid var(--gray2);border-radius:var(--rad2);font-size:12px;font-weight:500;color:var(--txt);background:var(--white);cursor:pointer;outline:none;-webkit-appearance:none;appearance:none;font-family:'Inter',sans-serif}
.f-sel:focus{border-color:var(--blue2)}
.f-chip{padding:5px 14px;border:1px solid var(--gray2);border-radius:99px;font-size:11px;font-weight:600;cursor:pointer;background:var(--white);color:var(--txt3);transition:all .15s;white-space:nowrap}
.f-chip.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.f-time{margin-left:auto;font-size:11px;color:var(--gray);font-family:'JetBrains Mono',monospace}

/* ── LAYOUT ── */
.main{padding:20px 24px;max-width:1400px;margin:0 auto}
.section-hdr{font-size:10px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.1em;margin:20px 0 10px;display:flex;align-items:center;gap:8px}
.section-hdr::after{content:'';flex:1;height:1px;background:var(--gray2)}

/* ── KPI GRID ── */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--white);border-radius:var(--rad);padding:18px 20px;box-shadow:var(--shadow);position:relative;overflow:hidden;border:1px solid transparent}
.kpi::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px}
.kpi.blue::after{background:linear-gradient(90deg,var(--blue),var(--blue2))}
.kpi.green::after{background:linear-gradient(90deg,var(--green),#34d399)}
.kpi.gold::after{background:linear-gradient(90deg,var(--gold),#f59e0b)}
.kpi.red::after{background:linear-gradient(90deg,var(--red),#f87171)}
.kpi.purple::after{background:linear-gradient(90deg,var(--purple),#a78bfa)}
.kpi-icon{font-size:22px;margin-bottom:8px;display:block}
.kpi-label{font-size:10px;font-weight:600;color:var(--gray);text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px}
.kpi-value{font-size:28px;font-weight:800;color:var(--txt);font-family:'JetBrains Mono',monospace;line-height:1;letter-spacing:-.02em}
.kpi-sub{font-size:11px;color:var(--txt3);margin-top:5px}
.kpi-delta{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;margin-top:6px}
.kpi-delta.up{background:var(--green2);color:var(--green)}
.kpi-delta.down{background:var(--red2);color:var(--red)}
.kpi-delta.neutral{background:var(--gray3);color:var(--gray)}

/* ── 2-COL ── */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}

/* ── CARD ── */
.card{background:var(--white);border-radius:var(--rad);box-shadow:var(--shadow);border:1px solid var(--gray2);overflow:hidden}
.card-hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--gray3)}
.card-hdr h4{font-size:13px;font-weight:700;color:var(--txt);display:flex;align-items:center;gap:6px}
.card-hdr .meta{font-size:11px;color:var(--gray);font-family:'JetBrains Mono',monospace}
.card-body{padding:16px 18px}

/* ── PROGRESS ── */
.prog-row{display:grid;grid-template-columns:140px 1fr 60px 90px;align-items:center;gap:10px;margin-bottom:12px}
.prog-row:last-child{margin-bottom:0}
.prog-label{font-size:12px;font-weight:600;color:var(--txt2);line-height:1.3}
.prog-track{height:10px;background:var(--gray3);border-radius:99px;overflow:hidden}
.prog-fill{height:100%;border-radius:99px;transition:width .8s cubic-bezier(.4,0,.2,1);position:relative}
.prog-fill::after{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);animation:shimmer 2s infinite}
@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.prog-fill.blue{background:linear-gradient(90deg,#1d4ed8,#60a5fa)}
.prog-fill.green{background:linear-gradient(90deg,#059669,#34d399)}
.prog-fill.gold{background:linear-gradient(90deg,#b45309,#fbbf24)}
.prog-fill.red{background:linear-gradient(90deg,#dc2626,#f87171)}
.prog-fill.purple{background:linear-gradient(90deg,#7c3aed,#a78bfa)}
.prog-pct{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;text-align:right}
.prog-vol{font-size:10px;color:var(--gray);text-align:right;font-family:'JetBrains Mono',monospace;line-height:1.4}

/* ── FALTANTE ── */
.falt-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.falt-card{background:var(--white);border-radius:var(--rad2);padding:14px 16px;box-shadow:var(--shadow);border:1px solid var(--gray2);position:relative;overflow:hidden}
.falt-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%}
.falt-card.pending::before{background:var(--red)}
.falt-card.done::before{background:var(--green)}
.falt-status{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.falt-card.pending .falt-status{color:var(--red)}
.falt-card.done .falt-status{color:var(--green)}
.falt-name{font-size:12px;font-weight:700;color:var(--txt);margin-bottom:10px;line-height:1.3}
.falt-rows{}
.falt-row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--gray3);font-size:11px}
.falt-row:last-child{border-bottom:none;padding-top:5px;font-weight:700}
.falt-key{color:var(--txt3)}
.falt-val{font-family:'JetBrains Mono',monospace;font-weight:600}
.falt-card.pending .falt-row:last-child .falt-val{color:var(--red)}
.falt-card.done .falt-row:last-child .falt-val{color:var(--green)}

/* ── CHART CARDS ── */
.chart-wrap{position:relative;padding:4px 0}

/* ── CAMIONES BAR ── */
.cam-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--gray3)}
.cam-row:last-child{border-bottom:none}
.cam-placa{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;width:90px;flex-shrink:0;color:var(--txt)}
.cam-bar-wrap{flex:1;height:12px;background:var(--gray3);border-radius:99px;overflow:hidden}
.cam-bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--blue),var(--blue2));transition:width .8s}
.cam-meta{font-size:11px;font-family:'JetBrains Mono',monospace;color:var(--txt3);width:80px;text-align:right;flex-shrink:0}
.cam-rank{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0}
.cam-rank.r1{background:#fef3c7;color:#b45309}
.cam-rank.r2{background:#f1f5f9;color:#475569}
.cam-rank.r3{background:#fef3c7;color:#92400e}
.cam-rank.rn{background:var(--gray3);color:var(--gray)}

/* ── TABLE ── */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
thead tr{background:var(--surf)}
th{font-size:10px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.07em;padding:10px 14px;text-align:left;white-space:nowrap;border-bottom:2px solid var(--gray2)}
th.r{text-align:right}
td{padding:10px 14px;border-bottom:1px solid var(--gray3);vertical-align:middle;color:var(--txt)}
td.r{text-align:right;font-family:'JetBrains Mono',monospace;font-size:11px}
td.mono{font-family:'JetBrains Mono',monospace;font-size:11px}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--blue4)}
.tot-row td{background:var(--blue3)!important;font-weight:700;border-top:2px solid var(--blue2)}
.badge{display:inline-flex;align-items:center;gap:3px;padding:3px 9px;border-radius:99px;font-size:10px;font-weight:700;white-space:nowrap}
.badge.G{background:var(--green2);color:var(--green)}
.badge.P{background:var(--red2);color:var(--red)}
.badge.ok{background:var(--blue3);color:var(--blue)}
.badge.warn{background:var(--gold2);color:var(--gold)}
.badge.na{background:var(--gray3);color:var(--gray)}

/* ── RUTAS ── */
.ruta-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ruta-card{background:var(--white);border-radius:var(--rad);padding:16px 18px;box-shadow:var(--shadow);border:1px solid var(--gray2)}
.ruta-obra{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--gray);margin-bottom:4px}
.ruta-km-big{font-size:36px;font-weight:800;font-family:'JetBrains Mono',monospace;color:var(--navy);line-height:1}
.ruta-km-label{font-size:11px;color:var(--txt3);margin-top:2px}
.ruta-stops{font-size:11px;color:var(--gray);margin-top:8px;line-height:1.7;padding-top:8px;border-top:1px solid var(--gray3)}
.ruta-stops span{display:inline-flex;align-items:center;gap:4px}
.ruta-bascula{background:var(--gold2);border:1px solid #fde68a;border-radius:6px;padding:6px 10px;margin-top:8px;font-size:11px;font-weight:600;color:var(--gold)}

/* ── EXPORT BAR ── */
.export-bar{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn-exp{display:flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--rad2);font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--gray2);background:var(--white);color:var(--txt2);transition:all .15s;font-family:'Inter',sans-serif}
.btn-exp:hover{border-color:var(--blue2);color:var(--blue)}
.btn-exp.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn-exp.primary:hover{background:#1e40af}
.btn-exp.ppt{background:var(--navy);color:#fff;border-color:var(--navy)}

/* ── PRESENTATION MODE ── */
body.ppt-mode .header{background:linear-gradient(135deg,#0f2744,#1e3a5f)}
body.ppt-mode .main{padding:24px 32px}
body.ppt-mode .kpi-value{font-size:32px}
body.ppt-mode .card{box-shadow:var(--shadow3);border:none}
body.ppt-mode .filters{display:none}
body.ppt-mode .export-bar{display:none}
.ppt-watermark{display:none;position:fixed;bottom:16px;right:20px;font-size:10px;color:var(--gray);font-weight:500;letter-spacing:.06em}
body.ppt-mode .ppt-watermark{display:block}

/* ── RESPONSIVE ── */
@media(max-width:900px){
  .two-col,.three-col{grid-template-columns:1fr}
  .ruta-grid{grid-template-columns:1fr}
  .main{padding:12px 14px}
  .header-inner{padding:12px 14px}
  .filters{padding:8px 14px}
  .prog-row{grid-template-columns:100px 1fr 45px 70px}
}
@media(max-width:600px){
  .kpi-grid{grid-template-columns:1fr 1fr}
  .kpi-value{font-size:22px}
  .header-title{font-size:16px}
  .falt-grid{grid-template-columns:1fr 1fr}
}
.sec-btn{padding:6px 14px;border-radius:99px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--blue2);background:var(--blue);color:#fff;transition:all .15s;font-family:'Inter',sans-serif}
.sec-btn.off{background:var(--white);color:var(--blue2)}
@media print{
  .filters,.export-bar,.sync-chip,.mode-toggle{display:none!important}
  .main{padding:10px}
  body{background:#fff}
  .card{box-shadow:none;border:1px solid #ddd}
}
</style>
</head>

</div>

<!-- PANEL DE SECCIONES -->
<div id="secPanel" style="display:none;background:#fff;border-bottom:1px solid var(--gray2);padding:10px 24px">

  <div style="display:flex;flex-wrap:wrap;gap:8px">
    <button id="sec-kpis"     onclick="toggleSec('kpis')"     class="sec-btn">📈 Producción del día</button>
    <button id="sec-avance"   onclick="toggleSec('avance')"   class="sec-btn">📐 Avance por concepto</button>
    <button id="sec-camiones" onclick="toggleSec('camiones')" class="sec-btn">🚛 Metros por camión</button>
    <button id="sec-graficas" onclick="toggleSec('graficas')" class="sec-btn">📊 Gráficas</button>
    <button id="sec-faltante" onclick="toggleSec('faltante')" class="sec-btn">⏳ Volumen faltante</button>
    <button id="sec-rutas"    onclick="toggleSec('rutas')"    class="sec-btn">🗺️ Distancias planta</button>
    <button id="sec-tabla"    onclick="toggleSec('tabla')"    class="sec-btn">📋 Detalle de viajes</button>
  </div>
</div>

<div class="main" id="mainContent">

const DEN=2.20, CONTRATO='2026-14-CB-D-039-W-00-2026', EMPRESA='Grupo Urbanizador Inmobiliario Yenter S.A. de C.V. y Sístole Consultoría y Obras S.A. de C.V.';
let allRecs=[], filtered=[], charts={}, rutaActual=1, filtros={obra:'all',fecha:'all'};

// Secciones visibles — todas activadas por defecto
let secciones={
  kpis:true,
  avance:true,
  camiones:true,
  graficas:true,
  faltante:true,
  rutas:true,
  tabla:true
};

// ── FIREBASE ──
const fb=initializeApp(FB);
const db=getFirestore(fb);
onSnapshot(query(collection(db,'viajes'),orderBy('ts','desc')), snap=>{
  allRecs=snap.docs.map(d=>({_id:d.id,...d.data()}));
  localStorage.setItem('rep039',JSON.stringify(allRecs));
  setSyncOk();
  buildFechaFilter();
  applyFilters();
},()=>{
  const c=localStorage.getItem('rep039');
  if(c){allRecs=JSON.parse(c);buildFechaFilter();applyFilters();}
  setSyncErr();
});

window.toggleSecciones = function() {
  const p = document.getElementById('secPanel');
  p.style.display = p.style.display==='none' ? 'block' : 'none';
};

window.toggleSec = function(k) {
  secciones[k] = !secciones[k];
  const btn = document.getElementById('sec-'+k);
  if (btn) btn.classList.toggle('off', !secciones[k]);
  applyFilters();
};

window.loadData=applyFilters;

function setSyncOk(){
  document.getElementById('syncDot').style.background='#10b981';
  document.getElementById('syncLabel').textContent='En vivo · '+new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
  document.getElementById('syncChip').className='sync-chip';
  document.getElementById('lastTime').textContent='Act: '+new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
}
function setSyncErr(){
  document.getElementById('syncDot').style.background='#ef4444';
  document.getElementById('syncLabel').textContent='Sin conexión · caché';
  document.getElementById('syncChip').className='sync-chip err';
}

function buildFechaFilter(){
  const fechas=[...new Set(allRecs.map(r=>r.fecha))].sort((a,b)=>b.localeCompare(a));
  const sel=document.getElementById('filtFecha');
  const cur=sel.value;
  sel.innerHTML='<option value="all">Todas las fechas</option>';
  fechas.forEach(f=>{
    const d=new Date(f+'T12:00:00');
    const lb=d.toLocaleDateString('es-MX',{weekday:'short',day:'numeric',month:'short'}).toUpperCase();
    sel.innerHTML+=`<option value="${f}" ${f===cur?'selected':''}>${lb}</option>`;
  });
}

window.setFilter=function(key,val,el){
  filtros[key]=val;
  if(el){
    if(key==='obra') document.querySelectorAll('[id^="fc-"]').forEach(b=>b.classList.remove('active'));
    else if(key==='ruta') document.querySelectorAll('[id^="fr-"]').forEach(b=>b.classList.remove('active'));
    if(el) el.classList.add('active');
  }
  applyFilters();
};
window.setRuta=function(n,el){
  rutaActual=n;
  document.querySelectorAll('[id^="fr-"]').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  applyFilters();
};
window.setMode=function(m,el){
  document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  if(m==='ppt') document.body.classList.add('ppt-mode');
  else document.body.classList.remove('ppt-mode');
};

function applyFilters(){
  filtered=allRecs.filter(r=>{
    if(filtros.obra==='obra1' && !(r.kde>=46000&&r.kde<=59000)) return false;
    if(filtros.obra==='obra2' && !(r.kde>=247000&&r.kde<=252000)) return false;
    if(filtros.fecha!=='all' && r.fecha!==filtros.fecha) return false;
    return true;
  });
  render();
}

function getKmRecorridos(r){
  const isO2=r.kde>=247000&&r.kde<=252000;
  const ruta=RUTAS[rutaActual];
  const oRuta=isO2?ruta.obra2:ruta.obra1;
  const kmObra=isO2?247600:46200;
  const kmExtra=Math.abs(((r.ka||r.kde)-kmObra)/1000);
  return (oRuta.km_total+kmExtra).toFixed(1);
}

// ── CALC EXEC ──
function calcExec(recs){
  const e={reniv:0,carp3:0,bach1:0,carp5:0,bach2:0};
  recs.forEach(r=>{
    const isO2=r.kde>=247000&&r.kde<=252000;
    const et=r.esp_teorico||3.5;
    if(isO2){if(et>=4.5)e.carp5+=r.volumen;else e.bach2+=r.volumen;}
    else{if(et<=3.5)e.carp3+=r.volumen;else if(et>=4.8)e.bach1+=r.volumen;else e.reniv+=r.volumen;}
  });
  return e;
}

// ── MAIN RENDER ──

  const emulAcum=filtered.reduce((s,r)=>s+(r.emulsion_lts||0),0);
  const exec=calcExec(filtered);
  const cambio=tonAyer>0?((tonHoy-tonAyer)/tonAyer*100).toFixed(1):null;
  const pctAvance=(volAcum/TOT_VOL*100).toFixed(1);

  // By date for charts
  const byDate={};
  filtered.forEach(r=>{if(!byDate[r.fecha])byDate[r.fecha]={ton:0,vol:0,vj:0,area:0};byDate[r.fecha].ton+=r.ton_recibidas;byDate[r.fecha].vol+=r.volumen;byDate[r.fecha].vj++;byDate[r.fecha].area+=r.area;});
  const fechas=Object.keys(byDate).sort();

  filtered.forEach(r=>{if(!byCam[r.placas])byCam[r.placas]={ton:0,long:0,vj:0,area:0};byCam[r.placas].ton+=r.ton_recibidas;byCam[r.placas].long+=r.longitud;byCam[r.placas].vj++;byCam[r.placas].area+=r.area;});
  const camList=Object.entries(byCam).sort((a,b)=>b[1].long-a[1].long);
  const maxLong=camList.length>0?camList[0][1].long:1;

  // Acum line
  let ac=0;
  const acums=fechas.map(f=>{ac+=byDate[f].vol;return +ac.toFixed(3);});

  const ruta=RUTAS[rutaActual];

  document.getElementById('mainContent').innerHTML = `

  ${secciones.kpis ? `

    <div class="kpi green"><span class="kpi-icon">📐</span><div class="kpi-label">Volumen hoy m³</div><div class="kpi-value">${volHoy.toFixed(2)}</div><div class="kpi-sub">${(volHoy*DEN).toFixed(1)} ton reales colocadas</div></div>
    <div class="kpi gold"><span class="kpi-icon">📦</span><div class="kpi-label">Ton acumuladas</div><div class="kpi-value">${tonAcum.toFixed(0)}</div><div class="kpi-sub">${filtered.length} viajes · ${Object.keys(byCam).length} camiones</div></div>
    <div class="kpi blue"><span class="kpi-icon">🧱</span><div class="kpi-label">Vol. acum m³</div><div class="kpi-value">${volAcum.toFixed(1)}</div><div class="kpi-sub">${pctAvance}% del catálogo total</div></div>
    <div class="kpi green"><span class="kpi-icon">💰</span><div class="kpi-label">m³ ganancia</div><div class="kpi-value">${m3FavAcum>=0?'+':''}${m3FavAcum.toFixed(2)}</div><div class="kpi-sub">${(m3FavAcum>=0?'+':'')}${favTon.toFixed(1)} ton a favor</div></div>
    <div class="kpi purple"><span class="kpi-icon">🛢️</span><div class="kpi-label">Emulsión ECR-65</div><div class="kpi-value">${emulAcum>0?emulAcum.toFixed(0):'—'}</div><div class="kpi-sub">${emulAcum>0&&areaAcum>0?(emulAcum/areaAcum).toFixed(3)+' lts/m²':'Sin registro'}</div></div>
  </div>` : ''}

  <!-- AVANCE + CAMIONES -->
  ${(secciones.avance||secciones.camiones) ? `
  <div class="section-hdr">🏗️ Avance físico y producción por camión</div>
  <div class="two-col">
    ${secciones.avance ? `<div class="card">
      <div class="card-hdr"><h4>📊 Progreso vs catálogo E-7</h4><div class="meta">${volAcum.toFixed(1)} / ${TOT_VOL} m³</div></div>
      <div class="card-body">
        ${[{key:'reniv',ex:exec.reniv},{key:'carp3',ex:exec.carp3},{key:'bach1',ex:exec.bach1},{key:'carp5',ex:exec.carp5},{key:'bach2',ex:exec.bach2}].map(c=>{
          const cat=CAT[c.key]; const pct=Math.min(c.ex/cat.vol*100,100); const falt=Math.max(cat.vol-c.ex,0);
          return `<div class="prog-row"><div class="prog-label">${cat.label}<br><span style="font-size:10px;color:var(--gray)">${cat.obra}</span></div><div class="prog-track"><div class="prog-fill ${cat.color}" style="width:${pct.toFixed(1)}%"></div></div><div class="prog-pct" style="color:${pct>=100?'var(--green)':pct>=50?'var(--blue)':'var(--gray)'}">${pct.toFixed(1)}%</div><div class="prog-vol">${c.ex.toFixed(1)}/${cat.vol}<br>falt: ${falt.toFixed(1)}</div></div>`;
        }).join('')}
      </div>
    </div>` : '<div></div>'}
    ${secciones.camiones ? `<div class="card">
      <div class="card-hdr"><h4>🚛 Metros lineales por camión</h4><div class="meta">${longAcum.toFixed(0)} m total</div></div>
      <div class="card-body">
        ${camList.slice(0,8).map(([placa,c],i)=>{
          const pct=Math.round(c.long/maxLong*100);
          const rankClass=i===0?'r1':i===1?'r2':i===2?'r3':'rn';
          const rankLabel=i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1)+'°';
          return `<div class="cam-row"><div class="cam-rank ${rankClass}">${rankLabel}</div><div class="cam-placa">${placa}</div><div class="cam-bar-wrap"><div class="cam-bar-fill" style="width:${pct}%"></div></div><div class="cam-meta">${c.long.toFixed(0)}m<br>${c.vj}vj · ${c.ton.toFixed(0)}t</div></div>`;
        }).join('')}
      </div>
    </div>` : '<div></div>'}
  </div>` : ''}

  <!-- GRÁFICAS -->
  ${secciones.graficas ? `
  <div class="section-hdr">📊 Gráficas de producción</div>
  <div class="two-col">
    <div class="card"><div class="card-hdr"><h4>📅 Toneladas por día</h4></div><div class="card-body" style="padding:12px 8px"><div id="chartDia" style="width:100%;height:180px"></div></div></div>
    <div class="card"><div class="card-hdr"><h4>📈 Volumen acumulado vs catálogo</h4></div><div class="card-body" style="padding:12px 8px"><div id="chartAcum" style="width:100%;height:180px"></div></div></div>
  </div>` : ''}

  <!-- FALTANTE -->
  ${secciones.faltante ? `
  <div class="section-hdr">⏳ Volumen faltante — cuánto queda por colocar</div>
  <div class="falt-grid">
    ${[{key:'reniv',ex:exec.reniv},{key:'carp3',ex:exec.carp3},{key:'bach1',ex:exec.bach1},{key:'carp5',ex:exec.carp5},{key:'bach2',ex:exec.bach2}].map(c=>{
      const cat=CAT[c.key]; const fM3=Math.max(cat.vol-c.ex,0); const fTon=fM3*DEN, fVj=Math.ceil(fTon/22); const done=fM3<=0.1;
      return `<div class="falt-card ${done?'done':'pending'}"><div class="falt-status">${done?'✅ COMPLETADO':'⏳ PENDIENTE'}</div><div class="falt-name">${cat.label} · ${cat.obra}</div><div class="falt-rows"><div class="falt-row"><span class="falt-key">Catálogo</span><span class="falt-val">${cat.vol} m³</span></div><div class="falt-row"><span class="falt-key">Ejecutado</span><span class="falt-val">${c.ex.toFixed(2)} m³</span></div><div class="falt-row"><span class="falt-key">Faltante m³</span><span class="falt-val">${done?'0':fM3.toFixed(2)}</span></div><div class="falt-row"><span class="falt-key">Faltante ton</span><span class="falt-val">${done?'0':fTon.toFixed(1)}</span></div><div class="falt-row"><span class="falt-key">Viajes faltantes</span><span class="falt-val">${done?'✓':fVj+' viajes'}</span></div></div></div>`;
    }).join('')}
  </div>` : ''}

  ${secciones.rutas ? `

  <div class="ruta-grid admin-only">
    <div class="ruta-card"><div class="ruta-obra">Obra 1 · MEX-200 km 46+200 – 58+700</div><div class="ruta-km-big">${ruta.obra1.km_total} km</div><div class="ruta-km-label">recorrido total ida</div><div class="ruta-bascula">⚖️ ${ruta.obra1.bascula}</div><div class="ruta-stops">${ruta.obra1.stops}</div><div style="margin-top:8px;font-size:11px;color:var(--gray)">Ciclo tortón: ~${Math.round(ruta.obra1.km_total*4+30)} min · Ciclos/día: ~${Math.floor(540/(ruta.obra1.km_total*4+30))}</div></div>

  </div>` : ''}

  <!-- TABLA DE PAGO -->
  ${secciones.tabla ? `
  <div class="section-hdr">🚛 Detalle de viajes · reporte de pago</div>

    <div class="card-hdr"><h4>📋 Registro de viajes</h4><div class="meta">${filtered.length} registros</div></div>

      <table>
        <thead><tr>
          <th>FECHA</th><th>PLACAS</th><th class="r">#</th>

          <th class="r">TON</th><th class="r">ÁREA m²</th>
          <th class="r">KM DESC.</th><th class="r admin-only">KM RECOR.</th>

  // Charts

function renderTableRows(){
  if(!filtered.length) return `<tr><td colspan="12" style="text-align:center;padding:40px;color:var(--gray)">Sin datos para los filtros seleccionados</td></tr>`;
  const bd={};
  filtered.forEach(r=>{if(!bd[r.fecha])bd[r.fecha]=[];bd[r.fecha].push(r);});
  let html='', totTon=0, totArea=0;
  Object.keys(bd).sort((a,b)=>b.localeCompare(a)).forEach(fecha=>{
    const rs=bd[fecha];
    const d=new Date(fecha+'T12:00:00');
    const lb=d.toLocaleDateString('es-MX',{weekday:'short',day:'numeric',month:'short',year:'2-digit'}).toUpperCase();
    const dT=rs.reduce((s,r)=>s+r.ton_recibidas,0);
    html+=`<tr style="background:var(--blue4)"><td colspan="12" style="padding:6px 14px;font-size:11px;font-weight:700;color:var(--blue)">📅 ${lb} · ${rs.length} viajes · ${dT.toFixed(1)} ton</td></tr>`;
    rs.forEach(r=>{
      const G=r.gp==='GANANCIA';
      const kmRec=getKmRecorridos(r);
      totTon+=r.ton_recibidas; totArea+=r.area;
      html+=`<tr>
        <td class="mono" style="white-space:nowrap">${r.fecha}</td>
        <td style="font-family:'JetBrains Mono',monospace;font-weight:700">${r.placas}</td>
        <td class="r">#${r.num_viaje_dia||'—'}</td>
        <td class="mono" style="color:var(--gray)">${r.vale||'—'}</td>
        <td class="mono" style="color:var(--gray)">${r.remision||'—'}</td>
        <td class="r">${r.ton_recibidas.toFixed(2)}</td>
        <td class="r">${r.area.toFixed(1)}</td>
        <td class="r" style="color:var(--blue);font-weight:600">${fmtKm(r.ka||r.kde)}</td>
        <td class="r admin-only" style="color:var(--blue2)">${kmRec} km</td>
        <td class="r" style="font-size:11px">${r.temp_produccion||'—'}°/${r.temp_tendido||'—'}°</td>
        <td><span class="badge ${G?'G':'P'}">${G?'▲ GANANCIA':'▼ PÉRDIDA'}</span></td>
        <td style="font-size:11px;color:var(--gray);max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${r.observaciones||''}</td>
      </tr>`;
    });
  });
  html+=`<tr class="tot-row"><td>TOTAL</td><td>—</td><td class="r">${filtered.length}</td><td>—</td><td>—</td><td class="r">${totTon.toFixed(2)}</td><td class="r">${totArea.toFixed(1)}</td><td class="r">—</td><td class="r admin-only">—</td><td class="r">—</td><td>—</td><td>—</td></tr>`;
  return html;
}

function fmtKm(n){
  if(!n)return '—';
  const km=Math.floor(n/1000);
  const m=Math.round(n%1000);
  return km+'+'+String(m).padStart(3,'0');
}

function buildCharts(fechas,labels,acums,byDate){
  // ── GRÁFICA 1: Barras de toneladas por día (SVG puro) ──
  const diaEl = document.getElementById('chartDia');
  if(diaEl && fechas.length > 0){
    const tons = fechas.map(f=>byDate[f].ton);
    const maxTon = Math.max(...tons) * 1.15 || 1;
    const W=diaEl.offsetWidth||400, H=180, PAD=36, BAR_GAP=6;
    const barW = Math.max(8, Math.floor((W - PAD*2 - BAR_GAP*(fechas.length-1)) / fechas.length));
    const totalBarsW = barW * fechas.length + BAR_GAP * (fechas.length-1);
    const startX = PAD + (W - PAD*2 - totalBarsW)/2;

    let bars='', xlabels='', ylabels='';
    // Y axis labels
    for(let i=0;i<=4;i++){
      const val = Math.round(maxTon * i/4);
      const y = H - PAD - (H-PAD*1.5)*i/4;
      ylabels += `<text x="${PAD-4}" y="${y+4}" text-anchor="end" font-size="9" fill="#94a3b8">${val}</text>`;
      ylabels += `<line x1="${PAD}" y1="${y}" x2="${W-8}" y2="${y}" stroke="#f1f5f9" stroke-width="1"/>`;
    }
    tons.forEach((t,i)=>{
      const bH = Math.max(2, (t/maxTon)*(H-PAD*1.5));
      const x = startX + i*(barW+BAR_GAP);
      const y = H - PAD - bH;
      bars += `<rect x="${x}" y="${y}" width="${barW}" height="${bH}" rx="3" fill="#1d4ed8" opacity="0.8"/>`;
      bars += `<text x="${x+barW/2}" y="${y-3}" text-anchor="middle" font-size="9" fill="#334155" font-weight="600">${t.toFixed(0)}</text>`;
      xlabels += `<text x="${x+barW/2}" y="${H-4}" text-anchor="middle" font-size="9" fill="#64748b">${labels[i]}</text>`;
    });
    diaEl.innerHTML = `<svg width="100%" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
      ${ylabels}${bars}${xlabels}
      <line x1="${PAD}" y1="${PAD/2}" x2="${PAD}" y2="${H-PAD}" stroke="#e2e8f0" stroke-width="1"/>
    </svg>`;
  }

  // ── GRÁFICA 2: Línea de volumen acumulado vs catálogo (SVG puro) ──
  const acumEl = document.getElementById('chartAcum');
  if(acumEl && fechas.length > 0){
    const W=acumEl.offsetWidth||400, H=180, PAD=40;
    const maxVal = TOT_VOL * 1.1;
    const pts = acums.map((v,i)=>{
      const x = PAD + (i/(Math.max(fechas.length-1,1))) * (W-PAD*1.5);
      const y = H-PAD - (v/maxVal)*(H-PAD*1.5);
      return {x,y,v};
    });
    const catY = H-PAD - (TOT_VOL/maxVal)*(H-PAD*1.5);

    // Y labels
    let yl='';
    for(let i=0;i<=4;i++){
      const val = Math.round(maxVal * i/4);
      const y = H - PAD - (H-PAD*1.5)*i/4;
      yl += `<text x="${PAD-4}" y="${y+4}" text-anchor="end" font-size="9" fill="#94a3b8">${val}</text>`;
      yl += `<line x1="${PAD}" y1="${y}" x2="${W-8}" y2="${y}" stroke="#f1f5f9" stroke-width="1"/>`;
    }

    // Catálogo line
    const catLine = `<line x1="${PAD}" y1="${catY}" x2="${W-8}" y2="${catY}" stroke="#cbd5e1" stroke-dasharray="6,3" stroke-width="1.5"/>
      <text x="${W-6}" y="${catY-4}" text-anchor="end" font-size="9" fill="#94a3b8">Cat ${TOT_VOL}</text>`;

    // Area fill
    let areaPath = `M${pts[0].x},${H-PAD}`;
    pts.forEach(p=>areaPath+=` L${p.x},${p.y}`);
    areaPath+=` L${pts[pts.length-1].x},${H-PAD} Z`;

    // Line path
    let linePath = `M${pts[0].x},${pts[0].y}`;
    pts.slice(1).forEach(p=>linePath+=` L${p.x},${p.y}`);

    // Points + labels
    let circles='', xlbls='';
    pts.forEach((p,i)=>{
      circles += `<circle cx="${p.x}" cy="${p.y}" r="4" fill="#1d4ed8" stroke="#fff" stroke-width="1.5"/>`;
      circles += `<text x="${p.x}" y="${p.y-8}" text-anchor="middle" font-size="9" fill="#334155" font-weight="600">${p.v.toFixed(1)}</text>`;
      xlbls += `<text x="${p.x}" y="${H-4}" text-anchor="middle" font-size="9" fill="#64748b">${labels[i]}</text>`;
    });

    acumEl.innerHTML = `<svg width="100%" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
      ${yl}
      ${catLine}
      <path d="${areaPath}" fill="#1d4ed8" fill-opacity="0.06"/>
      <path d="${linePath}" fill="none" stroke="#1d4ed8" stroke-width="2.5" stroke-linejoin="round"/>
      ${circles}${xlbls}
      <line x1="${PAD}" y1="${PAD/2}" x2="${PAD}" y2="${H-PAD}" stroke="#e2e8f0" stroke-width="1"/>
    </svg>`;
  }
}

// ── EXPORTS ──
window.exportPago=function(){
  const ruta=RUTAS[rutaActual];
  const h=['FECHA','PLACAS','VIAJE#','№_VALE','№_REMISION','TON_RECIBIDAS','AREA_M2','KM_DESCARGA','KMS_RECORRIDOS','TEMP_PROD','TEMP_TEND','GP','OBSERVACIONES'];
  const rows=filtered.map(r=>{
    const q=s=>`"${String(s||'').replace(/"/g,'""')}"`;
    return [r.fecha,r.placas,r.num_viaje_dia||'',q(r.vale||''),q(r.remision||''),r.ton_recibidas.toFixed(2),r.area.toFixed(2),fmtKm(r.ka||r.kde),getKmRecorridos(r),r.temp_produccion||'',r.temp_tendido||'',r.gp,q(r.observaciones||'')].join(',');
  });
  const tot=filtered.reduce((s,r)=>s+r.ton_recibidas,0);
  rows.push(['TOTAL','','','','',tot.toFixed(2),'','','','','','',''].join(','));
  dl([h.join(','),...rows].join('\n'),`PAGO_CAMIONES_N27_${new Date().toISOString().split('T')[0]}.csv`);
};

window.exportSICT=function(){
  const bd={};
  filtered.forEach(r=>{if(!bd[r.fecha])bd[r.fecha]=[];bd[r.fecha].push(r);});
  const q=s=>`"${String(s||'').replace(/"/g,'""')}"`;
  const h=['CONTRATO','EMPRESA','FECHA','ACTIVIDAD','DE_KM','A_KM','UNID','VOL_DIA_M3','VOL_ACUM_M3','AREA_M2','LONG_M','ANCHO_PROM','ESP_T_CM','TON','VIAJES'];
  let acum=0;
  const rows=[];
  Object.keys(bd).sort().forEach(f=>{
    const rs=bd[f];
    const dV=rs.reduce((s,r)=>s+r.volumen,0); acum+=dV;
    const dT=rs.reduce((s,r)=>s+r.ton_recibidas,0);
    const dA=rs.reduce((s,r)=>s+r.area,0);
    const dL=rs.reduce((s,r)=>s+r.longitud,0);
    const kmMin=Math.min(...rs.map(r=>r.kde));
    const kmMax=Math.max(...rs.map(r=>r.ka));
    rows.push([q(CONTRATO),q(EMPRESA),f,q('Renivelaciones con mezcla asfaltica en caliente'),fmtKm(kmMin),fmtKm(kmMax),'m3',dV.toFixed(4),acum.toFixed(4),dA.toFixed(2),dL.toFixed(0),(dA/dL||0).toFixed(2),(rs.reduce((s,r)=>s+r.esp_teorico,0)/rs.length).toFixed(1),dT.toFixed(2),rs.length].join(','));
  });
  dl([h.join(','),...rows].join('\n'),`GENERADOR_SICT_N27_${new Date().toISOString().split('T')[0]}.csv`);
};

window.exportCompleto=function(){
  const q=s=>`"${String(s||'').replace(/"/g,'""')}"`;
  const h=['VJ#','FECHA','PLACAS','TON','MATERIAL','PG','TIPO','VALE','REMISION','DE_KM','A_KM','LONG','ANCHO','ESP_T','CARRIL','AREA','VOL','ESP_R_CM','GP','M3_FAV','TEMP_P','TEMP_T','KM_RECORRIDOS','OBS','CAPTURADO_POR'];
  const rows=filtered.map(r=>[r.num_viaje_dia||'',r.fecha,r.placas,r.ton_recibidas.toFixed(2),r.material,r.pg,r.tipo,q(r.vale||''),q(r.remision||''),r.kde,r.ka,r.longitud,r.ancho.toFixed(2),r.esp_teorico,r.carril,r.area.toFixed(4),r.volumen.toFixed(4),(r.esp_real*100).toFixed(4),r.gp,r.m3_fav.toFixed(6),r.temp_produccion||'',r.temp_tendido||'',getKmRecorridos(r),q(r.observaciones||''),q(r.capturado_por||'')].join(','));
  dl([h.join(','),...rows].join('\n'),`TENDIDO_039_COMPLETO_${new Date().toISOString().split('T')[0]}.csv`);
};

function dl(content,filename){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\ufeff'+content],{type:'text/csv;charset=utf-8'}));
  a.download=filename; a.click();
}
